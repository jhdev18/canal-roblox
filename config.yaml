# Configuração geral. Tudo aqui pode ser sobrescrito na linha de comando (veja README).
render:
  largura: 1080
  altura: 1920
  fps: 30
  ao: true            # oclusão de ambiente (visual "three.js+"). false = mais rápido
  sombra: 2048        # resolução do mapa de sombra (1024 = mais rápido)
  gpu: auto           # auto | nao (nao = renderização por software, lenta)
  navegador: auto     # auto | chromium | chrome | msedge | caminho do executável
  encoder: libx264    # libx264 | h264_nvenc (usa a GTX 1050 Ti para codificar)

voz:
  motor: elevenlabs   # voz da VERSÃO FINAL (--final): elevenlabs | piper | espeak | windows | nenhum
                      # o rascunho (sem --final) usa sempre uma voz grátis do sistema
  # --- ElevenLabs (chave no arquivo .env) ---
  voice_id: "CstacWqMhJQlnfLPxRG4"   # voz da narração (ElevenLabs). Para trocar: node gerar.mjs --vozes
  modelo_eleven: eleven_multilingual_v2   # ou eleven_flash_v2_5 (mais barato/rápido)
  estabilidade: 0.45  # menor = mais expressivo
  similaridade: 0.8
  estilo: 0.3
  # idioma: pt        # só para modelos que aceitam language_code (ex.: eleven_flash_v2_5)
  # --- Piper (local) ---
  modelo: assets/vozes/pt_BR-faber-medium.onnx
  comando: [python, -m, piper]   # no Windows pode ser [py, -m, piper]
  velocidade: 1.1     # >1 = fala mais rápido (ElevenLabs aceita 0.7–1.2)
  pausa: 0.12         # silêncio extra no fim de cada cena (s)
  cuda: false
  voz_espeak: pt-br

legenda:
  fonte: Arial Black  # coloque .ttf em assets/fontes para usar outra fonte
  tamanho: 92
  cor: "#ffffff"
  contorno: "#000000"
  espessura: 7
  sombra: 3
  posicao_y: 0.67     # 0 = topo, 1 = base
  juntar_curtas: 2    # junta palavras com até N letras à próxima ("do tempo")
  minusculas: true
  sem_pontuacao: true
  pop: true
  destaque: "#ffd23f" # cor das palavras listadas em `destaque:` no roteiro

audio:
  musica_padrao: auto       # auto = escolhe pelo clima da história em assets/musicas/<clima>/ | nenhuma | <clima> | <arquivo>
  musica_volume: 0.25
  ducking: true             # música abaixa enquanto a voz fala
  sfx_volume: 0.8

saida:
  pasta: saida
