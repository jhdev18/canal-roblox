# Elenco reutilizável. Use pelo nome no roteiro ou herde com `base:`.
# Campos: pele, camisa, calca, rosto, extras (rosto), acessorios, roupa, cabelo_cor, escala, mangas, *_cor
# Cores: nome da paleta (amarelo, azul, verde_noob, vermelho, preto, branco, rosa, roxo, ...) ou "#rrggbb".
noob:        { pele: amarelo, camisa: azul, calca: verde_noob }
garoto:      { base: noob }
amigo:       { base: noob, camisa: vermelho }
pai:         { base: noob, extras: [barba] }
pai_terno:   { base: pai, roupa: terno, camisa: preto, calca: preto }
mae:         { pele: amarelo, camisa: rosa, calca: azul, acessorios: [cabelo_longo], cabelo_cor: marrom, extras: [cilios, blush] }
menina:      { pele: amarelo, camisa: roxo, calca: azul, acessorios: [rabo_de_cavalo, laco], cabelo_cor: "#3a2416", extras: [cilios, blush] }
noiva:       { pele: amarelo, camisa: branco, calca: branco, roupa: vestido, acessorios: [cabelo_longo, veu], cabelo_cor: "#e0207a", extras: [cilios, blush] }
nerd:        { pele: pele_clara, camisa: "#2b4c7e", calca: preto, acessorios: [cabelo_baguncado], cabelo_cor: preto, extras: [oculos] }
valentao:    { pele: pele_media, camisa: preto, calca: cinza_escuro, acessorios: [bone], bone_cor: vermelho, rosto: malandro }
medico:      { pele: pele_clara, camisa: branco, calca: azul, roupa: jaleco, acessorios: [careca_lados], cabelo_cor: cinza, extras: [oculos] }
professora:  { pele: pele_clara, camisa: roxo, calca: preto, acessorios: [coque], cabelo_cor: marrom, extras: [oculos, cilios] }
padre:       { pele: pele_clara, camisa: preto, calca: preto, roupa: terno, acessorios: [careca_lados], cabelo_cor: cinza, extras: [oculos] }
vovo:        { pele: pele_clara, camisa: bege, calca: marrom, acessorios: [careca_lados], cabelo_cor: branco, extras: [bigode, oculos] }
rei:         { base: noob, camisa: vinho, acessorios: [coroa, capa], capa_cor: vermelho, extras: [barba] }
policial:    { pele: pele_media, camisa: "#1d3b72", calca: "#1d3b72", acessorios: [bone], bone_cor: "#1d3b72", roupa: uniforme }
anjo:        { pele: amarelo, camisa: branco, calca: branco, acessorios: [aureola, asas] }
demonio:     { pele: vermelho, camisa: preto, calca: preto, acessorios: [chifres], chifre_cor: preto, rosto: malandro }
bebe:        { base: noob, escala: 0.6 }
gamer:       { base: noob, camisa: verde, acessorios: [fone, cabelo_espetado], cabelo_cor: laranja }

# --- cidade / política ---
prefeito:      { pele: pele_clara, camisa: "#1d2b4f", calca: "#1d2b4f", roupa: terno, acessorios: [cabelo_grisalho, faixa_prefeito], extras: [bigode], rosto: confiante }
primeira_dama: { pele: pele_clara, camisa: vermelho, calca: vermelho, roupa: vestido, acessorios: [coque, broche], cabelo_cor: "#3a2416", extras: [cilios, blush], rosto: sorriso }
vice_prefeito: { pele: pele_media, camisa: "#3d3f46", calca: "#3d3f46", roupa: terno, gravata_cor: "#1d3b72", acessorios: [careca_lados, faixa_prefeito], faixa_cor: "#c4281c", extras: [oculos] }
candidato_rival: { pele: pele_clara, camisa: vinho, calca: preto, roupa: terno, acessorios: [cabelo_curto], cabelo_cor: "#e0b040", rosto: malandro }
assessor:      { pele: pele_clara, camisa: cinza, calca: cinza_escuro, roupa: terno, acessorios: [cabelo_curto], cabelo_cor: "#2b1d14", extras: [oculos] }
seguranca:     { pele: pele_escura, camisa: preto, calca: preto, roupa: terno, acessorios: [careca_lados], cabelo_cor: preto, extras: [oculos_escuros], rosto: desconfiado }
reporter:      { pele: pele_media, camisa: vermelho, calca: preto, acessorios: [cabelo_longo], cabelo_cor: "#3a2416", extras: [cilios] }
cinegrafista:  { pele: pele_clara, camisa: cinza_escuro, calca: azul, acessorios: [bone], bone_cor: preto, extras: [barba] }
empresario:    { pele: pele_clara, camisa: preto, calca: preto, roupa: terno, acessorios: [cabelo_curto, broche], cabelo_cor: "#111", extras: [oculos_escuros], rosto: malandro }

# --- trabalhadores ---
gari:          { pele: pele_media, camisa: laranja, calca: laranja, acessorios: [bone, colete], bone_cor: laranja, colete_cor: "#ff7a00" }
bombeiro:      { pele: pele_clara, camisa: "#8a1f1f", calca: "#2b2b2b", acessorios: [capacete_bombeiro, colete], colete_cor: "#8a1f1f", extras: [bigode] }
taxista:       { pele: pele_media, camisa: amarelo, calca: azul, acessorios: [bone], bone_cor: amarelo, extras: [bigode] }
vendedor:      { pele: pele_media, camisa: verde, calca: bege, acessorios: [boina], boina_cor: vermelho, rosto: sorriso }
ladrao:        { pele: pele_clara, camisa: preto, calca: preto, roupa: listrada, acessorios: [touca], touca_cor: "#111", extras: [mascara], rosto: malandro }

# --- cidadãos ---
cidadao:       { pele: pele_media, camisa: "#3b6fd8", calca: bege, acessorios: [cabelo_curto], cabelo_cor: "#2b1d14" }
cidada:        { pele: pele_clara, camisa: rosa_claro, calca: azul, acessorios: [rabo_de_cavalo], cabelo_cor: "#7c5c46", extras: [cilios] }
idosa:         { pele: pele_clara, camisa: roxo, calca: cinza, acessorios: [coque], cabelo_cor: "#e8e8e8", extras: [oculos, cilios], rosto: feliz }
crianca:       { base: noob, camisa: laranja, acessorios: [cabelo_espetado], cabelo_cor: "#2b1d14", escala: 0.75 }

# --- bairro / família ---
vizinho:           { pele: pele_media, camisa: branco, calca: bege, roupa: regata, acessorios: [careca_lados], cabelo_cor: preto, extras: [bigode] }
vizinha_fofoqueira: { pele: pele_clara, camisa: rosa, calca: roxo, acessorios: [coque], cabelo_cor: "#e0b040", extras: [cilios, blush], rosto: malandro }
tia:               { pele: pele_media, camisa: laranja, calca: preto, acessorios: [cabelo_longo], cabelo_cor: "#3a2416", extras: [cilios], rosto: feliz }
tio:               { pele: pele_clara, camisa: verde, calca: azul, roupa: listrada, acessorios: [cabelo_curto], cabelo_cor: "#5a4636", extras: [barba] }
irmao_mais_velho:  { pele: amarelo, camisa: preto, calca: azul, acessorios: [cabelo_baguncado, fone], cabelo_cor: "#2b1d14", rosto: desconfiado }
irma:              { pele: amarelo, camisa: rosa_claro, calca: azul_claro, acessorios: [rabo_de_cavalo, laco], cabelo_cor: "#7c5c46", extras: [cilios, sardas] }
entregador:        { pele: pele_media, camisa: vermelho, calca: preto, acessorios: [capacete, mochila], capacete_cor: vermelho, mochila_cor: vermelho }
carteiro:          { pele: pele_clara, camisa: amarelo, calca: azul, acessorios: [bone, mochila], bone_cor: azul, mochila_cor: amarelo }
pedreiro:          { pele: pele_escura, camisa: cinza, calca: azul, acessorios: [capacete], capacete_cor: amarelo, extras: [bigode] }
jogador:           { pele: amarelo, camisa: amarelo, calca: azul, roupa: uniforme, acessorios: [cabelo_espetado], cabelo_cor: "#111" }
