titulo: Nesse mundo toda casa velha tem um fantasma
clima: engracado
decoracao: vovo   # decoração da casa do protagonista nesta história
destaque: [fantasma, assustar, ronco]
# História original (docs/HISTORIAS.md · curta 3) — comédia em lista, ~40 s, na casa do protagonista do mundo integrado.

elenco:
  nono: seu_nono
  mae: mae
  f1: fantasma
  f2: { base: fantasma, acessorios: [cartola] }
  f3: { base: fantasma, acessorios: [laco], laco_cor: rosa }

cenas:
  # --- regra ---
  - fala: Nesse mundo, toda casa velha tem um fantasma.
    som: pop
    onde: mundo
    local: casa
    hora: tarde
    cam: aberto
    dist: 1.5
    altura: 3
    mov: zoom_in
    atores: [{ id: f1, acao: acenar, rosto: feliz, x: 1.5, z: 1.5, y: 2.5 }]
  - fala: E quem mora nela tem que deixar ele assustar todo dia,
    onde: mundo
    local: casa
    comodo: sala
    cam: medio
    atores: [{ id: f1, acao: maos_pra_cima, rosto: bravo, x: 1.6, z: -2.5, vira: -30 }, { id: mae, acao: assustar, x: -1.6, z: -2.5, vira: 30 }]
  - fala: senão o fantasma fica triste e leva a sorte da casa embora.
    cam: close
    atores: [{ id: f1, acao: triste, rosto: chorando }]

  # --- a exceção ---
  - fala: Porém, o Seu Nonô, de noventa e dois anos, é impossível de assustar.
    som: boing
    comodo: sala
    cam: medio
    atores: [{ id: nono, acao: sentar, rosto: neutro }]

  # --- 1º fantasma ---
  - fala: O primeiro fantasma arrasta correntes no sótão.
    comodo: sotao
    hora: noite
    cam: aberto
    angulo: 20
    props: [{ tipo: corrente, x: -0.6, z: 1.6, n: 18 }, { tipo: corrente, x: 1.6, z: 0.6, n: 12 }]
    atores: [{ id: f1, acao: maos_pra_cima, rosto: bravo, x: 0.5, z: -0.6 }]
  - fala: O Seu Nonô reclama do barulho e manda ele passar óleo na corrente.
    cam: medio
    props: [{ tipo: corrente, x: -0.5, z: 1.2, n: 14 }]
    atores: [{ id: nono, acao: apontar, rosto: bravo, x: -1.8, vira: 40 }, { id: f1, acao: triste, rosto: surpreso, x: 1.8, vira: -40 }]

  # --- 2º fantasma ---
  - fala: O segundo fantasma aparece no espelho do banheiro.
    comodo: banheiro
    hora: dia
    cam: medio
    props: [{ tipo: espelho_grande, x: 0, z: -1 }]
    atores: [{ id: f2, acao: maos_pra_cima, rosto: bravo, x: 0, z: -2.4 }]
  - fala: O Seu Nonô, sem óculos, acha que é o próprio reflexo e penteia o cabelo dele.
    cam: medio
    angulo: 35
    props: [{ tipo: espelho_grande, x: 0, z: -1 }]
    atores: [{ id: f2, acao: cocar_cabeca, rosto: surpreso, x: 0, z: -2.4, vira: 0 }, { id: nono, acao: cocar_cabeca, rosto: feliz, x: 0, z: 0.8, vira: 180 }]

  # --- 3º fantasma ---
  - fala: O terceiro fantasma apaga todas as luzes à meia-noite.
    comodo: sala
    hora: noite
    cam: baixo
    atores: [{ id: f3, acao: espiar, rosto: malandro }]
  - fala: Mas o Seu Nonô dorme às sete.
    som: ronco
    comodo: quarto_pais
    hora: noite
    cam: alto
    angulo: 0
    foco: nono
    atores: [{ id: nono, acao: dormir, sobre: zzz }, { id: f3, acao: cocar_cabeca, rosto: desconfiado, x: 3.0, z: -1.2, vira: -60 }]

  # --- final ---
  - fala: Hoje os três tomam café com ele toda manhã
    comodo: cozinha
    hora: dia
    cam: medio
    angulo: 90
    atores: [{ id: nono, acao: sentar, rosto: feliz }, { id: f1, acao: sentar, rosto: feliz }, { id: f2, acao: sentar, rosto: rindo }, { id: f3, acao: sentar, rosto: feliz }]
  - fala: e assistem novela juntos.
    comodo: sala
    cam: aberto
    atores: [{ id: nono, acao: sentar, rosto: feliz }, { id: f1, acao: sentar, rosto: apaixonado }]
  - fala: E agora quem dorme de luz acesa são os fantasmas…
    comodo: quarto
    hora: noite
    cam: medio
    atores: [{ id: f1, acao: tremer, rosto: assustado, x: -2.6, vira: 15 }, { id: f2, acao: tremer, rosto: assustado, z: -0.8 }, { id: f3, acao: tremer, rosto: assustado, x: 2.6, vira: -15 }]
  - fala: com medo do ronco do Seu Nonô.
    som: ronco
    comodo: quarto_pais
    cam: alto
    angulo: 0
    foco: nono
    mov: tremor
    atores: [{ id: nono, acao: dormir, sobre: { texto: "RONC!", cor: "#ffd23f" } }, { id: f1, acao: assustar, x: 3.0, z: -1.2, vira: -60 }]
