titulo: Nesse mundo o celular diz quem vai salvar sua vida
clima: triste                      # piano emocionante (história com virada emotiva)
destaque: [valentão, salvar, vida]

elenco:
  garoto: noob
  valentao: valentao
  menina: menina
  amigo: amigo
  medico: medico

cenas:
  # --- gancho ---
  - fala: Nesse mundo, quando você faz dez anos,
    onde: rua
    cam: medio
    mov: seguir
    atores: [garoto andar feliz]
  - fala: o celular diz quem vai salvar a sua vida.
    onde: celular
    tela: { tipo: notificacao, app: Destino, titulo: Quem vai salvar sua vida, texto: "..." }
  - fala: Todo mundo recebia um herói.
    onde: parque
    cam: aberto
    atores: [menina comemorar, amigo comemorar]

  # --- problema ---
  - fala: "Mas o garoto recebeu o pior nome possível:"
    onde: quarto
    cam: close
    mov: zoom_rapido
    atores: [garoto celular surpreso]
  - fala: o valentão da escola.
    onde: celular
    tela: { tipo: notificacao, app: Destino, titulo: Quem vai salvar sua vida, texto: "O valentão da escola" }
  - fala: O mesmo que roubava o lanche dele todo dia.
    onde: escola
    cam: medio
    atores: [{ id: valentao, acao: bravo, x: -1.8 }, { id: garoto, acao: triste, x: 1.8 }]
  - fala: Por anos, o garoto fugiu dele.
    onde: rua
    cam: aberto
    mov: seguir
    foco: garoto
    atores: [{ id: garoto, acao: correr, vira: 90, x: -2, rosto: assustado }, { id: valentao, acao: correr, vira: 90, x: -8, rosto: malandro }]

  # --- virada ---
  - fala: Até que, numa noite,
    onde: rua
    hora: noite
    cam: baixo
    atores: [garoto celular desconfiado]
  - fala: um carro veio na direção dele.
    cam: aberto
    mov: tremor
    props: [{ tipo: carro, x: -6, z: 2, vira: 90 }]
    atores: [{ id: garoto, acao: assustar, x: 1 }]
  - fala: E alguém o empurrou pra longe.
    cam: lado
    mov: zoom_rapido
    atores: [{ id: valentao, acao: empurrar, x: -2, vira: 90, rosto: bravo }, { id: garoto, acao: cair, x: 1, vira: -90 }]
  - fala: Era o valentão, ferido no lugar dele.
    onde: hospital
    hora: dia
    cam: medio
    atores: [{ id: valentao, acao: deitar, rosto: triste, x: 3 }, { id: garoto, acao: chorar, x: -2.5 }]
  - fala: O garoto doou sangue e salvou a vida dele.
    cam: close
    foco: garoto
    atores: [{ id: garoto, acao: falar, rosto: triste, x: -2 }, { id: medico, acao: parado, rosto: feliz, x: 2 }]
  - fala: Foi aí que o valentão mostrou o celular dele.
    cam: medio
    atores: [{ id: valentao, acao: deitar, rosto: nervoso, x: 3 }, { id: garoto, acao: parado, rosto: surpreso, x: -2.5 }]
  - fala: Quem ia salvar a vida dele era o garoto.
    onde: celular
    tela: { tipo: notificacao, app: Destino, titulo: Quem vai salvar sua vida, texto: "O garoto que você mais maltratou" }

  # --- final ---
  - fala: Os dois nasceram pra salvar um ao outro.
    onde: parque
    hora: tarde
    cam: aberto
    mov: orbita
    atores: [{ id: garoto, acao: abracar, rosto: feliz, x: -1.3, vira: 60 }, { id: valentao, acao: abracar, rosto: feliz, x: 1.3, vira: -60 }]
