    onde: padaria
    cam: aberto
    mov: seguir
    foco: vovo
    atores: [{ id: vovo, acao: carregar, prop: sacola, x: -4, ate: [3, 1] }]
  - fala: A dona Maria vai na farmácia,
    onde: farmacia
    cam: medio
    atores: [idosa acenar]
  - fala: e o seu Zé joga na lotérica.
    onde: loterica
    cam: medio
    atores: [vizinho celular]
  - fala: Na praça, o prefeito conversa com o povo.
    onde: coreto
    cam: aberto
    atores: [{ id: prefeito, acao: discursar, x: 0 }]
    multidao: { n: 5, modo: grupos, personagens: [vizinha_fofoqueira, gari, crianca, cidada, padre], area: [-11, 11, -3, 2], livre: 3.5 }
