titulo: Nesse mundo a tristeza vira nuvem de chuva
clima: triste
destaque: [nuvem, chuva, guarda-chuva]
# História original (docs/HISTORIAS.md · curta 2) — terror que vira emoção, ~40 s.
# A nuvem é o indicador da regra: sobre: { tipo: nuvem_cabeca } (maior = mais triste).

elenco:
  bia: bia
  homem: cidadao
  mulher: cidada
  fofoqueira: vizinha_fofoqueira
  crianca: crianca
  idosa: idosa

cenas:
  - fala: Nesse mundo, quando alguém fica triste, uma nuvem de chuva nasce em cima da cabeça dele.
    som: chuva
    onde: mundo
    local: praca
    cam: medio
    atores: [{ id: homem, acao: triste, x: -1.6, vira: 25, sobre: { tipo: nuvem_cabeca, altura: 7 } }, { id: mulher, acao: parado, rosto: feliz, x: 1.8, vira: -25 }]
  - fala: As pessoas acreditam que quanto maior a nuvem, maior o azar.
    onde: mundo
    local: rua_bairro
    cam: medio
    atores: [{ id: fofoqueira, acao: apontar, x: -6.2, z: 1, vira: 20 }, { id: homem, acao: triste, x: -5.6, z: -3.5, vira: 10, sobre: { tipo: nuvem_cabeca, altura: 7 } }]
  - fala: A Bia tinha a maior nuvem da cidade.
    cam: medio
    mov: seguir
    foco: bia
    atores: [{ id: bia, acao: andar, rosto: triste, x: -6.4, z: -6, vira: 0, sobre: { tipo: nuvem_cabeca, escala: 1.4, altura: 8 } }]
  - fala: Desde pequena, chovia em cima dela todo dia.
    onde: mundo
    local: casa
    comodo: quarto
    cam: medio
    atores: [{ id: bia, acao: sentar, rosto: chorando, sobre: { tipo: nuvem_cabeca, escala: 1.3, altura: 7 } }]
  - fala: Ninguém chegava perto pra não molhar o sapato.
    onde: mundo
    local: escola
    cam: aberto
    atores: [{ id: bia, acao: parado, rosto: triste, sobre: { tipo: nuvem_cabeca, escala: 1.4, altura: 8 } }, { id: crianca, acao: correr_medo, x: 5, z: 1, vira: 90 }, { id: mulher, acao: andar, x: -5, z: 1, vira: -90 }]
  - fala: Até que chegou a Festa do Sol, o dia mais feliz do ano.
    onde: mundo
    local: praca
    cam: aberto
    props: [{ tipo: bandeirinhas, x: 0, z: -4, largura: 26 }, { tipo: bandeirinhas, x: 0, z: 4, largura: 26, altura: 6.5 }]
    multidao: { n: 14, modo: natural, area: [-16, 16, -12, 6], acao: [comemorar, dancar, palmas, rir] }
    atores: [{ id: mulher, acao: dancar, rosto: rindo }]
  - fala: A praça inteira sorria.
    cam: close
    props: [{ tipo: bandeirinhas, x: 0, z: -4, largura: 26 }]
    atores: [{ id: idosa, acao: rir, rosto: rindo }]
  - fala: Nenhuma nuvem no céu. Só a da Bia.
    cam: medio
    props: [{ tipo: bandeirinhas, x: 0, z: -4, largura: 26 }]
    multidao: { n: 10, modo: natural, area: [-16, 16, -12, 6], acao: [comemorar, dancar, palmas] }
    atores: [{ id: bia, acao: triste, sobre: { tipo: nuvem_cabeca, escala: 1.4, altura: 8 } }]
  - fala: E então o céu ficou vermelho.
    som: trovao
    hora: vermelho
    cam: aberto
    props: [{ tipo: bandeirinhas, x: 0, z: -4, largura: 26 }]
    multidao: { n: 12, modo: natural, area: [-16, 16, -12, 6], acao: [olhar_redor, assustar, apontar] }
    atores: [{ id: mulher, acao: assustar }]
  - fala: Começou a cair uma chuva quente, que queimava o que tocava.
    hora: vermelho
    cam: medio
    props: [{ tipo: chuva_brasas, largura: 34, prof: 28 }]
    multidao: { n: 10, modo: natural, area: [-16, 16, -12, 6], acao: [assustar, correr_medo, tremer] }
    atores: [{ id: homem, acao: assustar }]
  - fala: A cidade correu. Mas não tinha onde se esconder.
    onde: mundo
    local: rua_bairro
    hora: vermelho
    cam: aberto
    props: [{ tipo: chuva_brasas, largura: 30, prof: 40 }]
    atores: [{ id: homem, acao: correr_medo, x: -6.3, z: -8, vira: 0 }, { id: mulher, acao: fugir, x: 6.2, z: -10, vira: 0 }, { id: crianca, acao: correr_medo, x: -5.6, z: -14, vira: 0 }]
  - fala: Só debaixo de uma nuvem.
    onde: mundo
    local: praca
    hora: vermelho
    cam: close
    props: [{ tipo: chuva_brasas, largura: 34, prof: 28 }]
    atores: [{ id: bia, acao: olhar_redor, rosto: surpreso, sobre: { tipo: nuvem_cabeca, escala: 1.4, altura: 8 } }]
  - fala: A nuvem da Bia nunca foi azar.
    hora: vermelho
    cam: aberto
    props: [{ tipo: chuva_brasas, largura: 34, prof: 28 }]
    atores: [{ id: bia, acao: parado, rosto: confiante, sobre: { tipo: nuvem_cabeca, escala: 2.2, altura: 10 } }, { id: homem, acao: tremer, x: -2.4, z: 0.6, vira: 40 }, { id: mulher, acao: tremer, x: 2.4, z: 0.6, vira: -40 }, { id: crianca, acao: abracar, x: 0.4, z: 2.0, vira: 180 }]
  - fala: Era um guarda-chuva.
    som: boom
    hora: vermelho
    cam: medio
    angulo: 30
    props: [{ tipo: chuva_brasas, largura: 34, prof: 28 }]
    atores: [{ id: bia, acao: parado, rosto: feliz, sobre: { tipo: nuvem_cabeca, escala: 2.2, altura: 10 } }, { id: homem, acao: tremer, x: -2.4, z: 0.6, vira: 40 }, { id: mulher, acao: tremer, x: 2.4, z: 0.6, vira: -40 }, { id: idosa, acao: tremer, x: 0, z: -2.2 }]
  - fala: E naquela noite, pela primeira vez, todo mundo quis ficar do lado dela.
    hora: noite
    cam: medio
    atores: [{ id: bia, acao: parado, rosto: sorriso, sobre: { tipo: nuvem_cabeca, escala: 1.2, altura: 7 } }, { id: mulher, acao: abracar, x: -1.6, vira: 40 }, { id: crianca, acao: comemorar, x: 1.8, vira: -30 }]
